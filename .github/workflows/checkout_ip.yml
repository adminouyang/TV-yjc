name: Checkout IP Speed Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间 02:00

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IP_Scan   # 脚本在此目录下

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd curl

      - name: Run checkout_ip.sh
        run: bash checkout_ip.sh

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A IP_Scan/checkout_ip/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update IP speed test results [skip ci]"
            git push
          fi
