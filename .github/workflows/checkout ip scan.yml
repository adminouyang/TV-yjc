name: Checkout IP Scan text

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间 02:00

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 拉取完整历史，确保 rebase 可以正常工作

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run checkout_ip_scan.py
        run: python IP_Scan/checkout_ip_scan.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 暂存扫描结果目录下的所有变更（新增/修改/删除）
          git add -A IP_Scan/checkout_ip/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update IP scan test results [skip ci]"

          # 拉取远程最新 main，并将本次提交 rebase 到最新提交之上
          # 这样即使远程有别人提交的内容，也能顺利推送，且不会产生合并冲突
          echo "Fetching remote main..."
          git fetch origin main

          if git rebase origin/main; then
            echo "Rebase succeeded"
          else
            echo "Rebase failed, attempting merge..."
            git rebase --abort
            if git pull --no-edit origin main; then
              echo "Merge succeeded"
            else
              echo "Merge failed, cannot auto-resolve conflicts"
              git merge --abort
              exit 1
            fi
          fi

          git push origin main
