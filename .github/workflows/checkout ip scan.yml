name: Checkout IP Scan Test

# 并发控制：同一时间只运行一个，后触发的等待前一个完成
concurrency:
  group: ip-scan
  cancel-in-progress: false
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间 02:00

jobs:
  checkout:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装 Python 依赖（新脚本基于 asyncio + aiohttp）
      - name: Install dependencies
        run: pip install aiohttp

      # 4. 运行扫描脚本
      #    入口：IP_Scan/checkout_ip.py
      #    输出：
      #      - IP_Scan/checkout_ip/${province}_ip.txt            （有效 IP）
      #      - IP_Scan/checkout_ip/Invalid_ip_file/${province}_invalid.txt （无效 IP 记录）
      #    副作用：无区间且无有效的行会从原 *_config.txt 中删除
      - name: Run Checkout IP Script
        run: |
          python IP_Scan/checkout_ip_scan.py

      # 5. 提交并推送结果
      #    可能变化的文件：
      #      - 新生成/更新的 *_ip.txt
      #      - 追加的 Invalid_ip_file/*_invalid.txt
      #      - 被删除了无效行的 *_config.txt（原文件被回写）
      #    无变化时（diff 为空）不产生空提交，避免死循环
      - name: Commit and Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A IP_Scan/checkout_ip/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update IP scan results [skip ci]"

          # 拉取远程最新 main，并将本地提交 rebase 到其上
          echo "Pulling remote main with rebase..."
          git pull --rebase --autostash origin main

          # 推送
          git push origin main
