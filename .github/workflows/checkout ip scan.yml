name: Checkout IP Scan Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间 02:00

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IP_Scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 或 3.10/3.12，按需选择

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp requests netcat-openbsd 2>/dev/null || true
          # 系统层 netcat/curl（若脚本仍用到 nc/curl 可保留）
          sudo apt-get install -y netcat-openbsd curl 2>/dev/null || true

      - name: Run checkout_ip_scan.py
        run: python checkout_ip_scan.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A checkout_ip/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update IP scan results [skip ci]"
            git push
          fi
