name: checkout_ip_scan test

"on":
  workflow_dispatch:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00
    - cron: '0 18 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    # 脚本里 BASE_DIR / SAVE_DIR 都是 "IP_Scan/checkout_ip" 相对路径，
    # 所以所有 run 步骤都在仓库根下、以仓库根为 cwd 执行即可，不要切到 IP_Scan 子目录
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run IP scan
        run: python IP_Scan/checkout_ip_scan.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 脚本在仓库根下运行，结果相对路径就是 IP_Scan/checkout_ip/
          git add -A IP_Scan/checkout_ip/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update IP scan results [skip ci]"
            git push
          fi
